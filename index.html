<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Входящие заявки</title>
  <style>
    body { max-width: 40rem; margin: 2rem auto; padding: 0 1rem; font: 1rem/1.5 system-ui, sans-serif; }
    textarea { box-sizing: border-box; display: block; width: 100%; margin: .5rem 0; padding: .5rem; font: inherit; }
    button { padding: .4rem .8rem; font: inherit; }
    #status { min-height: 1.5rem; margin: 1rem 0; }
    #status[data-tone="warn"] { padding: .5rem .75rem; border-left: .25rem solid #b45309; background: #fef3c7; color: #1f2937; }
    #answer h2 { margin: 0 0 .5rem; font-size: 1.1rem; }
    dt { font-weight: 600; }
    dd { margin: 0 0 .75rem; white-space: pre-wrap; }
  </style>
</head>
<body>
  <h1>Входящие заявки</h1>
  <form>
    <label for="message">Текст заявки</label>
    <textarea id="message" rows="4"></textarea>
    <button type="submit">Разобрать заявку</button>
  </form>
  <p id="status" role="status"></p>
  <section id="answer" hidden>
    <h2>Результат разбора</h2>
    <dl>
      <dt>Тема</dt>
      <dd id="topic"></dd>
      <dt>Черновик ответа</dt>
      <dd id="draft"></dd>
    </dl>
  </section>
  <script type="module">
    const TOPIC_LABELS = { delivery: "Доставка", pricing: "Цена", other: "Другое" };
    const READY_NOTE = "Готово. Проверьте черновик перед отправкой клиенту.";
    const EMPTY_NOTE = "Введите текст заявки.";
    const MANUAL_NOTE = "Не удалось разобрать заявку автоматически. Разберите её вручную: тема и черновик не подготовлены.";

    const form = document.querySelector("form");
    const message = document.querySelector("#message");
    const status = document.querySelector("#status");
    const answer = document.querySelector("#answer");
    const topic = document.querySelector("#topic");
    const draft = document.querySelector("#draft");

    let lastRequestId = 0;
    let activeRequest = null;

    form.addEventListener("submit", async function handleSubmit(event) {
      event.preventDefault();
      const requestId = ++lastRequestId;
      activeRequest?.abort();
      if (message.value.trim() === "") return show({ note: EMPTY_NOTE, tone: "warn" });

      activeRequest = new AbortController();
      show({ note: "Разбираем заявку…" });
      let view;
      try {
        const reply = await fetch("/api/triage", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ text: message.value }),
          signal: activeRequest.signal,
        });
        view = viewFor(reply.status, await reply.json());
      } catch {
        view = { note: MANUAL_NOTE, tone: "warn" };
      }
      // Ответ на устаревший запрос не должен затирать более свежий результат.
      if (requestId === lastRequestId) show(view);
    });

    function viewFor(httpStatus, body) {
      if (httpStatus === 400) return { note: EMPTY_NOTE, tone: "warn" };
      if (httpStatus === 200 && body.status === "ready") {
        return { note: READY_NOTE, topic: TOPIC_LABELS[body.topic] ?? body.topic, draft: body.draft };
      }
      return { note: MANUAL_NOTE, tone: "warn" };
    }

    // Каждый показ начинается с чистого экрана, поэтому старый черновик не переживает сбой.
    function show({ note, tone = "", topic: topicText = "", draft: draftText = "" }) {
      status.textContent = note;
      status.dataset.tone = tone;
      topic.textContent = topicText;
      draft.textContent = draftText;
      answer.hidden = draftText === "";
    }
  </script>
</body>
</html>
